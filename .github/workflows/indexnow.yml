# Сообщает Яндексу, Bing и другим поисковикам (протокол IndexNow), что страницы сайта обновились.
# Запускается сам после каждого обновления сайта. Можно запустить вручную: Actions → IndexNow → Run workflow.
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подождать публикацию GitHub Pages
        run: sleep 90
      - name: Отправить список страниц
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          host = 'xn--80adpkcic0dzd.xn--p1acf'
          key = '7f3c9a41d2e84b6c9e05a1b8d4f26c73'
          urls = re.findall(r'<loc>(https://[^<]+/)</loc>', open('sitemap.xml', encoding='utf-8').read())
          body = json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': urls}).encode()
          for ep in ['https://api.indexnow.org/indexnow', 'https://yandex.com/indexnow', 'https://www.bing.com/indexnow']:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={'Content-Type': 'application/json; charset=utf-8'}), timeout=30)
                  print(ep, r.status, len(urls), 'страниц')
              except Exception as e:
                  print(ep, 'ошибка:', e)
          PY
